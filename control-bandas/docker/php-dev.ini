; Parámetros de PHP del entorno de desarrollo (reflejan los recomendados para producción, ver docs).
date.timezone = America/Hermosillo
memory_limit = 256M
post_max_size = 16M
upload_max_filesize = 8M
max_execution_time = 60
expose_php = Off
display_errors = On
log_errors = On
error_reporting = E_ALL
session.use_strict_mode = 1
session.cookie_httponly = 1
